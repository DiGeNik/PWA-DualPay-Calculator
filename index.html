<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DualPay - Калкулатор за ресто</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#f1f5f9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DualPay">
    
    <!-- Elegant Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    
    <link rel="manifest" id="pwa-manifest">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: 'Montserrat', sans-serif; 
            overscroll-behavior: none;
            background-color: #f1f5f9;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        .artistic-font {
            font-family: 'Comfortaa', cursive;
            font-weight: 700;
        }

        /* Цвят, извлечен от иконата на лъва */
        .lion-gold { color: #f59e0b; }
        
        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            display: grid;
            background-color: #f1f5f9;
        }

        .currency-item {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .currency-img-bg {
            width: 50px;
            height: 50px;
            opacity: 0.1;
            filter: grayscale(0.5);
            animation: float-animation 20s infinite ease-in-out;
        }

        @keyframes float-animation {
            0% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(15px, -25px) rotate(10deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .app-window {
            background-color: #dbeafe; 
            border: 1px solid #bfdbfe;
            backdrop-filter: blur(20px);
            z-index: 10;
            position: relative;
        }
        
        .input-field {
            background-color: #fef9c3 !important; 
            border: 1px solid #fde047;
            transition: all 0.2s ease;
        }

        .due-text { color: #dc2626; } 
        .pay-text { color: #2563eb; } 
        .change-text { color: #059669; } 
        
        .result-box {
            background-color: white; 
            border: 2px solid #10b981; 
        }

        .separator-bar {
            height: 2px;
            background: linear-gradient(to right, transparent, #3b82f6, transparent);
            opacity: 0.2;
            margin: 1.5rem 0;
        }

        .lion-icon-main {
            width: 54px;
            height: 54px;
            object-fit: contain;
        }

        /* Стил за контейнера на иконата, ако изображението липсва */
        .img-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: white;
            background: #f59e0b;
            border-radius: 1rem;
            width: 44px;
            height: 44px;
            font-size: 10px;
            text-align: center;
            line-height: 1;
        }

        @media screen and (max-width: 768px) {
            input { font-size: 16px !important; }
            .app-window { padding: 1.25rem !important; margin: 0.5rem; border-radius: 3rem; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-pattern" id="bgPattern"></div>

    <div class="max-w-md w-full app-window rounded-[4rem] shadow-[0_35px_70px_-15px_rgba(0,0,0,0.2)] p-10">
        <div class="flex flex-col items-center mb-8">
            <div class="w-24 h-24 bg-blue-600 rounded-[2.5rem] flex items-center justify-center shadow-2xl mb-4 relative overflow-hidden">
                <div class="absolute inset-0 bg-white opacity-10 transform -skew-x-12"></div>
                <div class="flex items-center gap-2 z-10">
                    <!-- Удебелен евро символ в златисто -->
                    <span class="lion-gold artistic-font text-4xl font-black">€</span>
                    <span class="text-white text-xl font-black opacity-30">⇄</span>
                    
                    <!-- Оригиналната икона на лъва като SVG -->
                    <div id="lionIconContainer">
                        <img src="912.svg" alt="BGN" class="lion-icon-main" 
                             onload="this.style.display='block'; document.getElementById('bgnFallback').style.display='none'"
                             onerror="this.style.display='none'; document.getElementById('bgnFallback').style.display='flex'">
                        <div id="bgnFallback" class="img-placeholder" style="display: none;">ЛЪВ<br>912</div>
                    </div>
                </div>
            </div>
            <h1 class="text-3xl font-bold text-slate-800 artistic-font tracking-tight">DualPay</h1>
            <p class="text-slate-500 text-[10px] font-bold uppercase tracking-[0.25em]">Smart Cash Control</p>
        </div>

        <div class="space-y-5">
            <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-2 uppercase tracking-widest pl-1">Сума за плащане</label>
                <div class="relative">
                    <input type="number" id="dueAmount" step="0.01" inputmode="decimal" placeholder="0.00" 
                        class="input-field due-text w-full px-5 py-4 rounded-2xl focus:ring-4 focus:ring-red-100 transition-all text-2xl font-black outline-none shadow-sm">
                    <select id="dueCurrency" class="absolute right-3 top-2.5 bottom-2.5 bg-white/90 backdrop-blur border-none rounded-xl text-xs px-2 shadow-sm font-bold text-slate-700 outline-none">
                        <option value="BGN">лв</option>
                        <option value="EUR">€</option>
                    </select>
                </div>
            </div>

            <div class="separator-bar"></div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2 tracking-widest pl-1">Платено лв</label>
                    <input type="number" id="payBgn" step="0.01" inputmode="decimal" placeholder="0.00" 
                        class="input-field pay-text w-full px-4 py-3.5 rounded-2xl focus:ring-4 focus:ring-blue-100 outline-none text-xl font-bold shadow-sm">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2 tracking-widest pl-1">Платено €</label>
                    <input type="number" id="payEur" step="0.01" inputmode="decimal" placeholder="0.00" 
                        class="input-field pay-text w-full px-4 py-3.5 rounded-2xl focus:ring-4 focus:ring-blue-100 outline-none text-xl font-bold shadow-sm">
                </div>
            </div>

            <div class="separator-bar"></div>

            <div class="flex items-center justify-between gap-4">
                <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Ресто в:</label>
                <div class="flex p-1.5 bg-blue-100/50 rounded-2xl flex-1 shadow-inner">
                    <button onclick="setChangeCurrency('EUR')" id="btnEur" class="flex-1 py-2.5 rounded-xl text-[10px] font-bold transition-all bg-white shadow-sm text-blue-700">EUR (€)</button>
                    <button onclick="setChangeCurrency('BGN')" id="btnBgn" class="flex-1 py-2.5 rounded-xl text-[10px] font-bold transition-all text-blue-600/60">BGN (лв)</button>
                </div>
            </div>

            <div id="resultBox" class="result-box mt-6 p-6 rounded-[3rem] hidden transform transition-all shadow-xl bg-white animate-in fade-in zoom-in duration-300">
                <div class="text-center">
                    <span class="text-slate-400 text-[9px] font-black uppercase tracking-[0.3em]">Ресто за връщане</span>
                    <div id="changeValue" class="change-text text-4xl font-black mt-2 artistic-font">0.00 €</div>
                    <div id="changeSecondary" class="text-slate-400 text-[11px] mt-2 font-medium"></div>
                </div>
            </div>

            <div id="errorBox" class="hidden p-4 bg-red-500 text-white rounded-2xl text-[10px] text-center font-black shadow-lg uppercase tracking-[0.2em]">
                Недостатъчна сума
            </div>
        </div>

        <footer class="mt-10 text-center text-[9px] text-slate-400 font-bold uppercase tracking-[0.3em] opacity-60">
            Курс: 1 EUR = 1.95583 BGN
        </footer>
    </div>

    <script>
        const goldColor = "#f59e0b";

        function initBackground() {
            const bgPattern = document.getElementById('bgPattern');
            if (!bgPattern) return;
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;
            const cellSize = screenWidth < 768 ? 80 : 120;
            const cols = Math.ceil(screenWidth / cellSize);
            const rows = Math.ceil(screenHeight / cellSize);
            bgPattern.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            bgPattern.style.gridTemplateRows = `repeat(${rows}, ${cellSize}px)`;
            bgPattern.innerHTML = ''; 
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'currency-item';
                    const isBgn = (r + c) % 2 !== 0;
                    
                    if (isBgn) {
                        const img = document.createElement('img');
                        img.src = "912.svg";
                        img.className = "currency-img-bg";
                        img.onerror = function() { this.style.opacity = '0'; };
                        wrapper.appendChild(img);
                    } else {
                        // Удебелен евро символ и за фона
                        wrapper.innerHTML = `<span style="color: ${goldColor}; font-family: Comfortaa; font-size: 32px; font-weight: 900; opacity: 0.18;">€</span>`;
                    }
                    bgPattern.appendChild(wrapper);
                }
            }
        }

        window.addEventListener('resize', initBackground);
        document.addEventListener('DOMContentLoaded', initBackground);

        const RATE = 1.95583;
        let targetChangeCurrency = 'EUR';

        const dueInput = document.getElementById('dueAmount');
        const dueCurrSelect = document.getElementById('dueCurrency');
        const payBgnInput = document.getElementById('payBgn');
        const payEurInput = document.getElementById('payEur');
        const resultBox = document.getElementById('resultBox');
        const errorBox = document.getElementById('errorBox');
        const changeValue = document.getElementById('changeValue');
        const changeSecondary = document.getElementById('changeSecondary');

        function setChangeCurrency(curr) {
            targetChangeCurrency = curr;
            const active = "flex-1 py-2.5 rounded-xl text-[10px] font-bold transition-all bg-white shadow-sm text-blue-700";
            const inactive = "flex-1 py-2.5 rounded-xl text-[10px] font-bold transition-all text-blue-600/60";
            document.getElementById('btnEur').className = curr === 'EUR' ? active : inactive;
            document.getElementById('btnBgn').className = curr === 'BGN' ? active : inactive;
            calculate();
        }

        function calculate() {
            const due = parseFloat(dueInput.value) || 0;
            const dueCurr = dueCurrSelect.value;
            const paidBgn = parseFloat(payBgnInput.value) || 0;
            const paidEur = parseFloat(payEurInput.value) || 0;
            if (due <= 0 && paidBgn === 0 && paidEur === 0) {
                resultBox.classList.add('hidden');
                errorBox.classList.add('hidden');
                return;
            }
            const dueInEur = dueCurr === 'EUR' ? due : due / RATE;
            const paidInEur = paidEur + (paidBgn / RATE);
            if (paidInEur < (dueInEur - 0.005) && due > 0) {
                resultBox.classList.add('hidden');
                errorBox.classList.remove('hidden');
                return;
            }
            errorBox.classList.add('hidden');
            resultBox.classList.remove('hidden');
            const diffInEur = Math.max(0, paidInEur - dueInEur);
            if (targetChangeCurrency === 'EUR') {
                changeValue.innerText = diffInEur.toFixed(2) + ' €';
                changeSecondary.innerText = '≈ ' + (diffInEur * RATE).toFixed(2) + ' лв';
            } else {
                changeValue.innerText = (diffInEur * RATE).toFixed(2) + ' лв';
                changeSecondary.innerText = '≈ ' + diffInEur.toFixed(2) + ' €';
            }
        }

        [dueInput, dueCurrSelect, payBgnInput, payEurInput].forEach(el => el.addEventListener('input', calculate));

        const manifest = {
            "name": "DualPay Калкулатор",
            "short_name": "DualPay",
            "start_url": window.location.href,
            "display": "standalone",
            "background_color": "#f1f5f9",
            "theme_color": "#2563eb",
            "icons": [ { "src": "92.svg", "sizes": "any", "type": "image/svg+xml" } ]
        };
        const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
        document.getElementById('pwa-manifest').setAttribute('href', URL.createObjectURL(manifestBlob));
    </script>
</body>
</html>
