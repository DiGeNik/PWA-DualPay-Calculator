<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DualPay - Калкулатор за ресто</title>
    
    <!-- PWA Настройки -->
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon_192.svg">
    <link rel="apple-touch-icon" href="icon_192.svg">

    <!-- Шрифтове -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --gold: #f59e0b; --primary-blue: #2563eb; --bg-blue: #dbeafe; }
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--bg-blue); 
            margin: 0; padding: 0; 
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .artistic-font { font-family: 'Comfortaa', cursive; font-weight: 700; }
        
        /* Динамичен фон */
        .bg-pattern {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; display: grid;
        }
        .currency-item { display: flex; align-items: center; justify-content: center; opacity: 0.08; }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }
        .bg-symbol { animation: float 10s infinite ease-in-out; }

        .app-window {
            background-color: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 3rem;
            box-shadow: 0 40px 100px -20px rgba(0,0,0,0.15);
        }

        .logo-tile {
            width: 115px; height: 85px;
            background-color: var(--primary-blue);
            border-radius: 2rem;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 20px 40px -10px rgba(37, 99, 235, 0.5);
            overflow: hidden;
        }

        .logo-img {
            width: 85%;
            height: 85%;
            object-fit: contain;
        }

        .input-field {
            background-color: #fef9c3 !important;
            border: 2px solid #fde047;
            border-radius: 1.5rem;
            transition: all 0.2s;
        }
        .input-field:focus { border-color: var(--gold); outline: none; transform: scale(1.02); }

        .segmented-control {
            background: rgba(37, 99, 235, 0.1);
            border-radius: 1.25rem;
            padding: 4px;
        }
        .segment-btn.active { background: white; color: var(--primary-blue); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-pattern" id="bgPattern"></div>

    <div class="max-w-md w-full app-window p-8 sm:p-12 relative">
        <div class="flex flex-col items-center mb-10">
            <div class="logo-tile mb-4">
                <img src="icon_512.svg" alt="DualPay Logo" class="logo-img" onerror="this.src='icon_192.svg'; this.onerror=function(){this.outerHTML='<span class=\'text-3xl text-amber-500 artistic-font\'>€ ↔ лв</span>'}">
            </div>
            <h1 class="text-3xl font-black text-slate-800 artistic-font">DualPay</h1>
            <p class="text-slate-500 text-[10px] font-bold uppercase tracking-widest">Smart Cash Control</p>
        </div>

        <div class="space-y-5">
            <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-1 uppercase pl-2">Сума за плащане</label>
                <input type="number" id="dueAmount" step="0.01" inputmode="decimal" placeholder="0.00" class="input-field w-full px-6 py-4 text-3xl font-black text-red-600">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 mb-1 uppercase pl-2">Платено лв</label>
                    <input type="number" id="payBgn" step="0.01" inputmode="decimal" placeholder="0.00" class="input-field w-full px-5 py-4 text-xl font-black text-blue-600">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 mb-1 uppercase pl-2">Платено €</label>
                    <input type="number" id="payEur" step="0.01" inputmode="decimal" placeholder="0.00" class="input-field w-full px-5 py-4 text-xl font-black text-blue-600">
                </div>
            </div>

            <div class="segmented-control flex">
                <button onclick="setMode('EUR')" id="btnEur" class="segment-btn active flex-1 py-3 rounded-xl text-[10px] font-black uppercase">Върни €</button>
                <button onclick="setMode('BGN')" id="btnBgn" class="segment-btn flex-1 py-3 rounded-xl text-[10px] font-black uppercase text-slate-500">Върни лв</button>
            </div>

            <div id="resultBox" class="mt-6 p-8 rounded-[2.5rem] bg-white/90 text-center border-2 border-emerald-500 hidden transform transition-all">
                <span class="text-[10px] font-black uppercase text-slate-400">Ресто</span>
                <div id="changeValue" class="text-5xl font-black text-emerald-600 artistic-font mt-2">0.00 €</div>
                <div id="changeSecondary" class="text-slate-400 text-xs mt-2 font-bold italic"></div>
            </div>

            <div id="errorBox" class="hidden p-4 bg-red-500 text-white rounded-2xl text-[10px] text-center font-black uppercase animate-pulse">
                Недостатъчна сума
            </div>
        </div>

        <footer class="mt-10 text-center text-slate-400 text-[10px] font-bold">
            КУРС: 1 EUR = 1.95583 BGN | DiNikolova ©
        </footer>
    </div>

    <script>
        // Инициализация на Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                if (location.protocol === 'https:' || location.hostname === 'localhost') {
                    navigator.serviceWorker.register('./sw.js')
                        .then(function() { console.log('PWA Ready'); })
                        .catch(function(err) { console.error('PWA Fail:', err); });
                }
            });
        }

        const RATE = 1.95583;
        let mode = 'EUR';

        function setMode(m) {
            mode = m;
            document.getElementById('btnEur').classList.toggle('active', m === 'EUR');
            document.getElementById('btnBgn').classList.toggle('active', m === 'BGN');
            calculate();
        }

        function calculate() {
            const dueInput = document.getElementById('dueAmount');
            const bgnInput = document.getElementById('payBgn');
            const eurInput = document.getElementById('payEur');
            
            const due = parseFloat(dueInput.value) || 0;
            const bgn = parseFloat(bgnInput.value) || 0;
            const eur = parseFloat(eurInput.value) || 0;
            
            const totalPaidEur = eur + (bgn / RATE);
            const dueInEur = due / RATE;
            
            const res = document.getElementById('resultBox');
            const err = document.getElementById('errorBox');

            if (due > 0 && totalPaidEur < (dueInEur - 0.001)) {
                res.classList.add('hidden');
                err.classList.remove('hidden');
                return;
            }

            err.classList.add('hidden');
            if (due > 0 || totalPaidEur > 0) {
                res.classList.remove('hidden');
                const diff = Math.max(0, totalPaidEur - dueInEur);
                if (mode === 'EUR') {
                    document.getElementById('changeValue').innerText = diff.toFixed(2) + ' €';
                    document.getElementById('changeSecondary').innerText = 'или ' + (diff * RATE).toFixed(2) + ' лв';
                } else {
                    document.getElementById('changeValue').innerText = (diff * RATE).toFixed(2) + ' лв';
                    document.getElementById('changeSecondary').innerText = 'или ' + diff.toFixed(2) + ' €';
                }
            } else {
                res.classList.add('hidden');
            }
        }

        // Слушатели за промяна
        document.querySelectorAll('input').forEach(function(input) {
            input.addEventListener('input', calculate);
        });

        // Генериране на фонови символи
        window.addEventListener('DOMContentLoaded', function() {
            const bg = document.getElementById('bgPattern');
            if (bg) {
                bg.style.gridTemplateColumns = 'repeat(5, 1fr)';
                for(let i = 0; i < 20; i++) {
                    const d = document.createElement('div');
                    d.className = 'currency-item';
                    const symbol = i % 2 === 0 ? '€' : 'лв';
                    d.innerHTML = '<span class="bg-symbol text-2xl font-bold">' + symbol + '</span>';
                    bg.appendChild(d);
                }
            }
        });
    </script>
</body>
</html>
