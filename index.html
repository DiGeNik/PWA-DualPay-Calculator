<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DualPay - Калкулатор за ресто</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#f1f5f9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DualPay">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    
    <link rel="manifest" id="pwa-manifest">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-blue: #dbeafe;
            --border-blue: #bfdbfe;
            --gold: #f59e0b;
        }

        body { 
            font-family: 'Montserrat', sans-serif; 
            overscroll-behavior: none;
            background-color: #f1f5f9;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        .artistic-font {
            font-family: 'Comfortaa', cursive;
            font-weight: 700;
        }

        /* ДИНАМИЧЕН ФОН */
        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            display: grid;
            background-color: #f1f5f9;
        }

        .currency-item {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        /* АНИМАЦИЯ: Движение, Ротация и Мащабиране */
        @keyframes complex-float {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); }
            33% { transform: translate(15px, -20px) rotate(8deg) scale(1.1); }
            66% { transform: translate(-10px, 10px) rotate(-5deg) scale(0.95); }
            100% { transform: translate(0, 0) rotate(0deg) scale(1); }
        }

        .bg-symbol-img {
            width: 60px; height: 60px;
            opacity: 0.12;
            background: transparent !important;
            animation: complex-float 18s infinite ease-in-out;
        }

        .bg-euro-text {
            font-size: 42px;
            opacity: 0.12;
            color: var(--gold);
            animation: complex-float 22s infinite ease-in-out;
        }

        /* ГЛАВЕН ПРОЗОРЕЦ - GLASSMORPHISM */
        .app-window {
            background-color: rgba(219, 234, 254, 0.75); 
            border: 1px solid rgba(191, 219, 254, 0.9);
            backdrop-filter: blur(30px) saturate(160%);
            -webkit-backdrop-filter: blur(30px) saturate(160%);
            border-radius: 3rem; /* 48px */
            box-shadow: 0 35px 70px -15px rgba(0,0,0,0.25), 0 15px 30px -10px rgba(0,0,0,0.1);
            z-index: 10;
            position: relative;
        }
        
        /* ЛОГО ПЛОЧКА */
        .logo-tile {
            width: 100px;
            height: 100px;
            background-color: #2563eb;
            border-radius: 2.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 35px -5px rgba(37, 99, 235, 0.4);
            position: relative;
            overflow: hidden;
        }

        .logo-inner {
            display: flex;
            align-items: flex-end;
            z-index: 10;
            transform: translate(6px, -4px); /* Позициониране надясно и нагоре */
        }

        /* ДВУПОСОЧНА СТРЕЛКА - Плътна и Контрастна */
        .transfer-arrow {
            color: white;
            font-size: 22px;
            font-weight: 900;
            margin: 0 4px 6px 4px;
            opacity: 0.95;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            line-height: 1;
        }

        .euro-logo {
            font-size: 42px;
            color: var(--gold);
            line-height: 1;
            margin-bottom: -4px;
        }

        .lion-logo-container {
            width: 68px;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: -18px;
            margin-bottom: -2px;
            transform: translateY(2px);
        }

        .lion-icon-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
        }

        /* ТЕКСТОВИ ПОЛЕТА */
        .input-field {
            background-color: rgba(254, 249, 195, 0.95) !important;
            border: 1px solid #fde047;
            border-radius: 1.25rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .input-field:focus {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px -5px rgba(253, 224, 71, 0.4);
        }

        .due-text { color: #dc2626; } 
        .pay-text { color: #2563eb; } 
        .change-text { color: #059669; } 

        .separator-bar {
            height: 2px;
            background: linear-gradient(to right, transparent, #3b82f6, transparent);
            opacity: 0.2;
            margin: 1.5rem 0;
        }

        @media (max-width: 640px) {
            .app-window { padding: 1.5rem !important; margin: 0.5rem; }
            .logo-tile { width: 85px; height: 85px; }
            .euro-logo { font-size: 34px; }
            .lion-logo-container { width: 55px; height: 55px; margin-left: -14px; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Динамичен фон -->
    <div class="bg-pattern" id="bgPattern"></div>

    <!-- Основен прозорец -->
    <div class="max-w-md w-full app-window p-10">
        <div class="flex flex-col items-center mb-8">
            <div class="logo-tile mb-4">
                <!-- Гланциран ефект върху плочката -->
                <div class="absolute inset-0 bg-white opacity-10 transform -skew-x-12 translate-x-[-50%]"></div>
                
                <div class="logo-inner"> 
                    <span class="euro-logo artistic-font drop-shadow-md">€</span>
                    <span class="transfer-arrow">⇄</span>
                    <div class="lion-logo-container">
                        <img src="512.svg" alt="BGN" class="lion-icon-img">
                    </div>
                </div>
            </div>
            
            <h1 class="text-3xl font-bold text-slate-800 artistic-font tracking-tight">DualPay</h1>
            <p class="text-slate-500 text-[10px] font-bold uppercase tracking-[0.25em]">Smart Cash Control</p>
        </div>

        <div class="space-y-6">
            <!-- Поле за плащане -->
            <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-2 uppercase tracking-widest pl-1">Сума за плащане</label>
                <div class="relative">
                    <input type="number" id="dueAmount" step="0.01" inputmode="decimal" placeholder="0.00" 
                        class="input-field due-text w-full px-5 py-4 text-2xl font-black outline-none shadow-sm">
                    <select id="dueCurrency" class="absolute right-3 top-2.5 bottom-2.5 bg-white/90 backdrop-blur border-none rounded-xl text-xs px-2 shadow-sm font-bold text-slate-700 outline-none">
                        <option value="BGN">лв</option>
                        <option value="EUR">€</option>
                    </select>
                </div>
            </div>

            <div class="separator-bar"></div>

            <!-- Полета за платено -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2 tracking-widest pl-1">Платено лв</label>
                    <input type="number" id="payBgn" step="0.01" inputmode="decimal" placeholder="0.00" 
                        class="input-field pay-text w-full px-4 py-3.5 outline-none text-xl font-bold shadow-sm">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2 tracking-widest pl-1">Платено €</label>
                    <input type="number" id="payEur" step="0.01" inputmode="decimal" placeholder="0.00" 
                        class="input-field pay-text w-full px-4 py-3.5 outline-none text-xl font-bold shadow-sm">
                </div>
            </div>

            <div class="separator-bar"></div>

            <!-- Ресто валута -->
            <div class="flex items-center justify-between gap-4">
                <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Ресто в:</label>
                <div class="flex p-1.5 bg-blue-100/50 rounded-2xl flex-1 shadow-inner">
                    <button onclick="setChangeCurrency('EUR')" id="btnEur" class="flex-1 py-2.5 rounded-xl text-[10px] font-bold transition-all bg-white shadow-sm text-blue-700">EUR (€)</button>
                    <button onclick="setChangeCurrency('BGN')" id="btnBgn" class="flex-1 py-2.5 rounded-xl text-[10px] font-bold transition-all text-blue-600/60">BGN (лв)</button>
                </div>
            </div>

            <!-- Резултат -->
            <div id="resultBox" class="mt-6 p-6 rounded-[2.5rem] hidden border-2 border-emerald-500 shadow-xl bg-white/90 animate-in fade-in zoom-in duration-300">
                <div class="text-center">
                    <span class="text-slate-400 text-[9px] font-black uppercase tracking-[0.3em]">Ресто за връщане</span>
                    <div id="changeValue" class="change-text text-4xl font-black mt-2 artistic-font">0.00 €</div>
                    <div id="changeSecondary" class="text-slate-400 text-[11px] mt-2 font-medium"></div>
                </div>
            </div>

            <div id="errorBox" class="hidden p-4 bg-red-500 text-white rounded-2xl text-[10px] text-center font-black shadow-lg uppercase tracking-[0.2em]">
                Недостатъчна сума
            </div>
        </div>

        <footer class="mt-10 text-center text-[9px] text-slate-400 font-bold uppercase tracking-[0.3em] opacity-70">
            Курс: 1 EUR = 1.95583 BGN
        </footer>
    </div>

    <script>
        // ИНИЦИАЛИЗАЦИЯ НА ФОНА
        function initBackground() {
            const bgPattern = document.getElementById('bgPattern');
            if (!bgPattern) return;
            
            const cellSize = window.innerWidth < 640 ? 100 : 140; 
            const cols = Math.ceil(window.innerWidth / cellSize);
            const rows = Math.ceil(window.innerHeight / cellSize);
            
            bgPattern.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            bgPattern.innerHTML = ''; 
            
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'currency-item';
                    
                    // Стриктно редуване (Шахматно)
                    if ((r + c) % 2 === 0) {
                        wrapper.innerHTML = `<span class="bg-euro-text artistic-font">€</span>`;
                    } else {
                        wrapper.innerHTML = `<img src="512.svg" class="bg-symbol-img">`;
                    }
                    bgPattern.appendChild(wrapper);
                }
            }
        }

        window.addEventListener('resize', initBackground);
        window.onload = initBackground;

        // ЛОГИКА НА КАЛКУЛАТОРА
        const RATE = 1.95583;
        let targetChangeCurrency = 'EUR';

        function setChangeCurrency(curr) {
            targetChangeCurrency = curr;
            const active = "flex-1 py-2.5 rounded-xl text-[10px] font-bold transition-all bg-white shadow-sm text-blue-700";
            const inactive = "flex-1 py-2.5 rounded-xl text-[10px] font-bold transition-all text-blue-600/60";
            document.getElementById('btnEur').className = curr === 'EUR' ? active : inactive;
            document.getElementById('btnBgn').className = curr === 'BGN' ? active : inactive;
            calculate();
        }

        function calculate() {
            const due = parseFloat(document.getElementById('dueAmount').value) || 0;
            const dueCurr = document.getElementById('dueCurrency').value;
            const paidBgn = parseFloat(document.getElementById('payBgn').value) || 0;
            const paidEur = parseFloat(document.getElementById('payEur').value) || 0;
            
            const resultBox = document.getElementById('resultBox');
            const errorBox = document.getElementById('errorBox');

            if (due <= 0 && paidBgn === 0 && paidEur === 0) {
                resultBox.classList.add('hidden');
                errorBox.classList.add('hidden');
                return;
            }
            
            const dueInEur = dueCurr === 'EUR' ? due : due / RATE;
            const paidInEur = paidEur + (paidBgn / RATE);
            
            if (paidInEur < (dueInEur - 0.005) && due > 0) {
                resultBox.classList.add('hidden');
                errorBox.classList.remove('hidden');
                return;
            }
            
            errorBox.classList.add('hidden');
            resultBox.classList.remove('hidden');
            const diffInEur = Math.max(0, paidInEur - dueInEur);
            
            const valEl = document.getElementById('changeValue');
            const secEl = document.getElementById('changeSecondary');

            if (targetChangeCurrency === 'EUR') {
                valEl.innerText = diffInEur.toFixed(2) + ' €';
                secEl.innerText = '≈ ' + (diffInEur * RATE).toFixed(2) + ' лв';
            } else {
                valEl.innerText = (diffInEur * RATE).toFixed(2) + ' лв';
                secEl.innerText = '≈ ' + diffInEur.toFixed(2) + ' €';
            }
        }

        ['dueAmount', 'dueCurrency', 'payBgn', 'payEur'].forEach(id => {
            document.getElementById(id).addEventListener('input', calculate);
        });

        // PWA Manifest
        const manifest = {
            "name": "DualPay Калкулатор",
            "short_name": "DualPay",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#f1f5f9",
            "theme_color": "#2563eb",
            "icons": [ { "src": "512.svg", "sizes": "any", "type": "image/svg+xml" } ]
        };
        const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
        document.getElementById('pwa-manifest').setAttribute('href', URL.createObjectURL(manifestBlob));
    </script>
</body>
</html>
