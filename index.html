<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DualPay - Калкулатор за ресто</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#f1f5f9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DualPay">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --gold: #f59e0b;
            --primary-blue: #2563eb;
        }

        body { 
            font-family: 'Montserrat', sans-serif; 
            overscroll-behavior: none;
            background-color: #f1f5f9;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        .artistic-font {
            font-family: 'Comfortaa', cursive;
            font-weight: 700;
        }

        /* ДИНАМИЧЕН ФОН */
        .bg-pattern {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; pointer-events: none;
            display: grid; background-color: #f1f5f9;
        }

        .currency-item {
            display: flex; align-items: center; justify-content: center;
            width: 100%; height: 100%;
        }

        @keyframes complex-float {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); }
            50% { transform: translate(10px, -10px) rotate(3deg) scale(1.05); }
            100% { transform: translate(0, 0) rotate(0deg) scale(1); }
        }

        /* Твоята икона като фонов елемент */
        .bg-custom-icon {
            width: 40px; 
            height: 60px; /* Пропорция 512x768 */
            opacity: 0.08;
            object-fit: contain;
            animation: complex-float 15s infinite ease-in-out;
        }

        .bg-euro-text {
            font-size: 38px; opacity: 0.1; color: var(--gold);
            animation: complex-float 18s infinite ease-in-out;
        }

        /* ГЛАВЕН ПРОЗОРЕЦ */
        .app-window {
            background-color: rgba(219, 234, 254, 0.75); 
            border: 1px solid rgba(191, 219, 254, 0.9);
            backdrop-filter: blur(25px);
            border-radius: 3rem;
            box-shadow: 0 35px 70px -15px rgba(0,0,0,0.1);
            position: relative;
        }
        
        /* ЛОГО ПЛОЧКА */
        .logo-tile {
            width: 140px; 
            height: 120px;
            background-color: var(--primary-blue);
            border-radius: 2.5rem;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 15px 35px -5px rgba(37, 99, 235, 0.3);
            position: relative;
        }

        .logo-inner {
            display: flex; align-items: center; gap: 8px;
        }

        /* Твоята външна икона 512.svg */
        .main-custom-icon {
            width: 52px; 
            height: 78px; /* Запазена пропорция 512x768 */
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
        }

        .euro-logo { font-size: 44px; color: var(--gold); }

        .transfer-arrow-svg {
            width: 30px; height: 20px; fill: var(--gold);
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.2));
        }

        /* ИНПУТ ПОЛЕТА */
        .input-field {
            background-color: rgba(254, 249, 195, 0.9) !important;
            border: 1px solid #fde047;
            border-radius: 1.25rem;
        }

        .due-text { color: #dc2626; } 
        .pay-text { color: #2563eb; } 
        .change-text { color: #059669; } 

        .separator-bar {
            height: 1px;
            background: linear-gradient(to right, transparent, #3b82f6, transparent);
            opacity: 0.2; margin: 1.5rem 0;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-pattern" id="bgPattern"></div>

    <div class="max-w-md w-full app-window p-8 sm:p-10">
        <div class="flex flex-col items-center mb-8">
            <div class="logo-tile mb-4">
                <div class="logo-inner"> 
                    <span class="euro-logo artistic-font">€</span>
                    <svg class="transfer-arrow-svg" viewBox="0 0 24 24">
                        <path d="M22 12c0-.3-.1-.5-.3-.7l-4-4c-.4-.4-1-.4-1.4 0s-.4 1 0 1.4l2.3 2.3H5.4l2.3-2.3c.4-.4.4-1 0-1.4s-1-.4-1.4 0l-4 4c-.2.2-.3.4-.3.7s.1.5.3.7l4 4c.2.2.5.3.7.3s.5-.1.7-.3c.4-.4.4-1 0-1.4L5.4 13h13.2l-2.3 2.3c-.4.4-.4 1 0 1.4.2.2.5.3.7.3s.5-.1.7-.3l4-4c.2-.2.3-.4.3-.7z"/>
                    </svg>
                    <!-- ВЪНШНА ИКОНА 512.svg -->
                    <img id="mainLogoIcon" class="main-custom-icon" src="512.svg" alt="Lion" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <!-- Fallback ако файлът липсва -->
                    <div style="display:none; color: white; font-size: 10px;">512.svg липсва</div>
                </div>
            </div>
            
            <h1 class="text-3xl font-bold text-slate-800 artistic-font tracking-tight">DualPay</h1>
            <p class="text-slate-500 text-[10px] font-bold uppercase tracking-[0.25em]">Smart Cash Control</p>
        </div>

        <div class="space-y-6">
            <!-- СУМА ЗА ПЛАЩАНЕ -->
            <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-2 uppercase tracking-widest pl-1">Сума за плащане</label>
                <div class="relative">
                    <input type="number" id="dueAmount" step="0.01" inputmode="decimal" placeholder="0.00" class="input-field due-text w-full px-5 py-4 text-2xl font-black outline-none shadow-sm">
                    <select id="dueCurrency" class="absolute right-3 top-3 bottom-3 bg-white border-none rounded-xl text-xs px-2 font-bold text-slate-700">
                        <option value="BGN">лв</option>
                        <option value="EUR">€</option>
                    </select>
                </div>
            </div>

            <div class="separator-bar"></div>

            <!-- ПЛАТЕНО -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2 tracking-widest pl-1">Платено лв</label>
                    <input type="number" id="payBgn" step="0.01" inputmode="decimal" placeholder="0.00" class="input-field pay-text w-full px-4 py-3.5 outline-none text-xl font-bold">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2 tracking-widest pl-1">Платено €</label>
                    <input type="number" id="payEur" step="0.01" inputmode="decimal" placeholder="0.00" class="input-field pay-text w-full px-4 py-3.5 outline-none text-xl font-bold">
                </div>
            </div>

            <div class="separator-bar"></div>

            <!-- ИЗБОР НА ВАЛУТА ЗА РЕСТО -->
            <div class="flex items-center justify-between gap-4">
                <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Ресто в:</label>
                <div class="flex p-1 bg-blue-100/50 rounded-2xl flex-1">
                    <button onclick="setChangeCurrency('EUR')" id="btnEur" class="flex-1 py-2.5 rounded-xl text-[10px] font-bold transition-all bg-white shadow-sm text-blue-700">EUR (€)</button>
                    <button onclick="setChangeCurrency('BGN')" id="btnBgn" class="flex-1 py-2.5 rounded-xl text-[10px] font-bold transition-all text-blue-600/60">BGN (лв)</button>
                </div>
            </div>

            <!-- РЕЗУЛТАТ -->
            <div id="resultBox" class="mt-6 p-6 rounded-[2.5rem] hidden border-2 border-emerald-500 shadow-xl bg-white/95">
                <div class="text-center">
                    <span class="text-slate-400 text-[9px] font-black uppercase tracking-[0.3em]">Ресто за връщане</span>
                    <div id="changeValue" class="change-text text-4xl font-black mt-2 artistic-font">0.00 €</div>
                    <div id="changeSecondary" class="text-slate-400 text-[11px] mt-2 font-medium"></div>
                </div>
            </div>

            <div id="errorBox" class="hidden p-4 bg-red-500 text-white rounded-2xl text-[10px] text-center font-black uppercase tracking-[0.2em]">
                Недостатъчна сума
            </div>
        </div>

        <footer class="mt-10 text-center text-[9px] text-slate-400 font-bold uppercase tracking-[0.3em]">
            Курс: 1 EUR = 1.95583 BGN
        </footer>
    </div>

    <script>
        const ICON_PATH = "512.svg";

        function initBackground() {
            const bgPattern = document.getElementById('bgPattern');
            if (!bgPattern) return;
            const cellSize = 150; 
            const cols = Math.ceil(window.innerWidth / cellSize);
            const rows = Math.ceil(window.innerHeight / cellSize);
            bgPattern.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            bgPattern.innerHTML = ''; 
            for (let i = 0; i < rows * cols; i++) {
                const wrapper = document.createElement('div');
                wrapper.className = 'currency-item';
                if (i % 2 === 0) {
                    wrapper.innerHTML = `<span class="bg-euro-text artistic-font">€</span>`;
                } else {
                    wrapper.innerHTML = `<img src="${ICON_PATH}" class="bg-custom-icon" onerror="this.style.opacity='0'">`;
                }
                bgPattern.appendChild(wrapper);
            }
        }

        window.addEventListener('resize', initBackground);
        window.onload = initBackground;

        const RATE = 1.95583;
        let targetChangeCurrency = 'EUR';

        function setChangeCurrency(curr) {
            targetChangeCurrency = curr;
            document.getElementById('btnEur').className = curr === 'EUR' ? "flex-1 py-2.5 rounded-xl text-[10px] font-bold transition-all bg-white shadow-sm text-blue-700" : "flex-1 py-2.5 rounded-xl text-[10px] font-bold transition-all text-blue-600/60";
            document.getElementById('btnBgn').className = curr === 'BGN' ? "flex-1 py-2.5 rounded-xl text-[10px] font-bold transition-all bg-white shadow-sm text-blue-700" : "flex-1 py-2.5 rounded-xl text-[10px] font-bold transition-all text-blue-600/60";
            calculate();
        }

        function calculate() {
            const due = parseFloat(document.getElementById('dueAmount').value) || 0;
            const dueCurr = document.getElementById('dueCurrency').value;
            const paidBgn = parseFloat(document.getElementById('payBgn').value) || 0;
            const paidEur = parseFloat(document.getElementById('payEur').value) || 0;
            
            const resultBox = document.getElementById('resultBox');
            const errorBox = document.getElementById('errorBox');

            const dueInEur = dueCurr === 'EUR' ? due : due / RATE;
            const paidInEur = paidEur + (paidBgn / RATE);
            
            if (due <= 0 && paidBgn === 0 && paidEur === 0) {
                resultBox.classList.add('hidden');
                errorBox.classList.add('hidden');
                return;
            }

            if (paidInEur < (dueInEur - 0.005) && due > 0) {
                resultBox.classList.add('hidden');
                errorBox.classList.remove('hidden');
                return;
            }
            
            errorBox.classList.add('hidden');
            resultBox.classList.remove('hidden');
            const diffInEur = Math.max(0, paidInEur - dueInEur);
            
            if (targetChangeCurrency === 'EUR') {
                document.getElementById('changeValue').innerText = diffInEur.toFixed(2) + ' €';
                document.getElementById('changeSecondary').innerText = '≈ ' + (diffInEur * RATE).toFixed(2) + ' лв';
            } else {
                document.getElementById('changeValue').innerText = (diffInEur * RATE).toFixed(2) + ' лв';
                document.getElementById('changeSecondary').innerText = '≈ ' + diffInEur.toFixed(2) + ' €';
            }
        }

        ['dueAmount', 'dueCurrency', 'payBgn', 'payEur'].forEach(id => {
            document.getElementById(id).addEventListener('input', calculate);
        });
    </script>
</body>
</html>
