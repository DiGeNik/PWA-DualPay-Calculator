<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DualPay - Калкулатор за ресто</title>
    
    <!-- PWA Settings -->
    <meta name="theme-color" content="#2563eb">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2454/2454282.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --gold: #f59e0b; --primary-blue: #2563eb; --bg-blue: #dbeafe; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--bg-blue); margin: 0; padding: 0; overflow-x: hidden; }
        .artistic-font { font-family: 'Comfortaa', cursive; font-weight: 700; }
        .bg-pattern { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; display: grid; }
        .currency-item { display: flex; align-items: center; justify-content: center; opacity: 0.08; }
        .app-window { background-color: rgba(255, 255, 255, 0.4); border: 1px solid rgba(255, 255, 255, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 3rem; box-shadow: 0 40px 100px -20px rgba(0,0,0,0.15); }
        .logo-tile { width: 115px; height: 85px; background-color: var(--primary-blue); border-radius: 2rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 40px -10px rgba(37, 99, 235, 0.5); position: relative; }
        .input-field { background-color: #fef9c3 !important; border: 2px solid #fde047; border-radius: 1.5rem; transition: all 0.2s; }
        .input-field:focus { border-color: var(--gold); transform: translateY(-2px); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-pattern" id="bgPattern"></div>
    
    <div class="max-w-md w-full app-window p-8 sm:p-12 relative overflow-hidden">
        <div class="flex flex-col items-center mb-10">
            <div class="logo-tile mb-4">
                <span class="text-3xl text-amber-500 artistic-font">€ ↔ лв</span>
            </div>
            <h1 class="text-3xl font-black text-slate-800 artistic-font tracking-tight">DualPay</h1>
            <p class="text-slate-500 text-[10px] font-bold uppercase tracking-[0.3em]">Smart Cash Control</p>
        </div>

        <div class="space-y-5">
            <div>
                <label class="block text-[10px] font-black text-slate-500 mb-2 uppercase tracking-widest pl-2">Сума за плащане</label>
                <input type="number" id="dueAmount" step="0.01" inputmode="decimal" placeholder="0.00" class="input-field w-full px-6 py-4 text-3xl font-black outline-none shadow-sm text-red-600">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-[10px] font-black text-slate-500 uppercase mb-2 tracking-widest pl-2">Платено лв</label>
                    <input type="number" id="payBgn" step="0.01" inputmode="decimal" placeholder="0.00" class="input-field w-full px-5 py-4 text-xl font-black outline-none text-blue-600">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-500 uppercase mb-2 tracking-widest pl-2">Платено €</label>
                    <input type="number" id="payEur" step="0.01" inputmode="decimal" placeholder="0.00" class="input-field w-full px-5 py-4 text-xl font-black outline-none text-blue-600">
                </div>
            </div>

            <div id="resultBox" class="mt-6 p-8 rounded-[2.5rem] bg-white/90 text-center border-2 border-emerald-500 hidden transform transition-all">
                <span class="text-[10px] font-black uppercase tracking-widest text-slate-400">Ресто (в Евро)</span>
                <div id="changeValue" class="text-5xl font-black text-emerald-600 artistic-font mt-2">0.00 €</div>
                <div id="changeSecondary" class="text-slate-400 text-xs mt-2 font-bold italic"></div>
            </div>

            <div id="errorBox" class="hidden p-4 bg-red-500 text-white rounded-2xl text-[10px] text-center font-black uppercase tracking-widest animate-pulse">
                Недостатъчна сума
            </div>
        </div>

        <footer class="mt-10 text-center text-slate-400 text-[10px] font-bold">
            КУРС: 1 EUR = 1.95583 BGN<br>
            <span class="opacity-50">DiNikolova ©</span>
        </footer>
    </div>

    <script>
        // Service Worker Registration for GitHub Pages
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('PWA Ready'))
                    .catch(err => console.log('PWA Error', err));
            });
        }

        const RATE = 1.95583;
        function calculate() {
            const due = parseFloat(document.getElementById('dueAmount').value) || 0;
            const paidBgn = parseFloat(document.getElementById('payBgn').value) || 0;
            const paidEur = parseFloat(document.getElementById('payEur').value) || 0;
            
            const totalPaidInEur = paidEur + (paidBgn / RATE);
            const dueInEur = due / RATE;
            
            const resultBox = document.getElementById('resultBox');
            const errorBox = document.getElementById('errorBox');

            if (due > 0 && totalPaidInEur < (dueInEur - 0.001)) {
                resultBox.classList.add('hidden');
                errorBox.classList.remove('hidden');
                return;
            }

            errorBox.classList.add('hidden');
            if (due > 0 || totalPaidInEur > 0) {
                resultBox.classList.remove('hidden');
                const diffEur = Math.max(0, totalPaidInEur - dueInEur);
                document.getElementById('changeValue').innerText = diffEur.toFixed(2) + ' €';
                document.getElementById('changeSecondary').innerText = 'или ' + (diffEur * RATE).toFixed(2) + ' лв';
            } else {
                resultBox.classList.add('hidden');
            }
        }

        document.querySelectorAll('input').forEach(i => i.addEventListener('input', calculate));

        // Background initialization
        const bg = document.getElementById('bgPattern');
        const cells = 20;
        bg.style.gridTemplateColumns = 'repeat(5, 1fr)';
        for(let i=0; i<cells; i++) {
            const div = document.createElement('div');
            div.className = 'currency-item text-4xl font-bold';
            div.innerText = i % 2 === 0 ? '€' : 'лв';
            bg.appendChild(div);
        }
    </script>
</body>
</html>
